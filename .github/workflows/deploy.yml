name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options: [staging, production]

env:
  AWS_REGION: us-east-1
  ECR_API_REPO: sentinel-uptime-api
  ECR_WORKER_REPO: sentinel-uptime-worker
  ECS_CLUSTER: sentinel-uptime-production
  ECS_SERVICE: sentinel-uptime-api

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: tag
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build & push API image
        id: build-api
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
        run: |
          docker build \
            --cache-from $ECR_REGISTRY/$ECR_API_REPO:latest \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t $ECR_REGISTRY/$ECR_API_REPO:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_API_REPO:latest \
            apps/api
          docker push $ECR_REGISTRY/$ECR_API_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_API_REPO:latest
          echo "IMAGE=$ECR_REGISTRY/$ECR_API_REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build & push Worker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_WORKER_REPO:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_WORKER_REPO:latest \
            -f apps/api/Dockerfile.worker apps/api
          docker push $ECR_REGISTRY/$ECR_WORKER_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_WORKER_REPO:latest

      - name: Update Lambda worker
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
        run: |
          aws lambda update-function-code \
            --function-name sentinel-uptime-worker-production \
            --image-uri $ECR_REGISTRY/$ECR_WORKER_REPO:$IMAGE_TAG \
            --publish

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition sentinel-uptime-api-production \
            --query taskDefinition > task-def.json

      - name: Update ECS task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: api
          image: ${{ steps.build-api.outputs.IMAGE }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment failed for commit ${{ github.sha }}"
